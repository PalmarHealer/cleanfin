name: Build

on:
  push:
    branches: [main]
    paths:
      - 'css/**'
      - 'js/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tools
        run: npm install -g sass esbuild

      # ---------- CSS ----------
      - name: Concatenate SCSS sources
        run: |
          mkdir -p build
          : > build/_bundle.scss
          for f in $(ls css/*.scss | sort); do
            echo "/* === $(basename "$f") === */" >> build/_bundle.scss
            cat "$f" >> build/_bundle.scss
            echo "" >> build/_bundle.scss
          done

      - name: Compile expanded CSS
        run: sass --no-source-map --style=expanded build/_bundle.scss style.css

      - name: Compile minified CSS
        run: sass --no-source-map --style=compressed build/_bundle.scss style.min.css

      # ---------- JS ----------
      - name: Bundle JS with feature toggles
        run: |
          mkdir -p build
          {
            echo "/* goodFin script bundle — toggle individual modules via:"
            echo "   window.goodFin = { features: { firefoxWarning: false } };"
            echo "   (set this BEFORE this script loads) */"
            echo "window.goodFin = window.goodFin || {};"
            echo "window.goodFin.features = window.goodFin.features || {};"
            echo ""
            echo "/* Enforce theme: these scripts are designed as additions to the goodFin CSS."
            echo "   If the theme sentinel (--goodfin) is missing, auto-load style.min.css. */"
            echo "(function () {"
            echo "  function hasTheme() {"
            echo "    return getComputedStyle(document.documentElement).getPropertyValue('--goodfin').trim() !== '';"
            echo "  }"
            echo "  function injectTheme() {"
            echo "    if (document.querySelector('link[data-goodfin]')) return;"
            echo "    var l = document.createElement('link');"
            echo "    l.rel = 'stylesheet';"
            echo "    l.href = 'https://cdn.jsdelivr.net/gh/PalmarHealer/goodfin@main/style.min.css';"
            echo "    l.dataset.goodfin = '1';"
            echo "    (document.head || document.documentElement).appendChild(l);"
            echo "    console.warn('[goodFin] theme CSS was not detected — auto-loaded style.min.css. The scripts are designed as additions to the theme.');"
            echo "  }"
            echo "  if (document.readyState === 'loading') {"
            echo "    document.addEventListener('DOMContentLoaded', function () { if (!hasTheme()) injectTheme(); }, { once: true });"
            echo "  } else if (!hasTheme()) {"
            echo "    injectTheme();"
            echo "  }"
            echo "})();"
            echo ""
          } > build/_bundle.js

          to_camel() {
            echo "$1" | awk -F- '{out=$1; for(i=2;i<=NF;i++){out=out toupper(substr($i,1,1)) substr($i,2)}; print out}'
          }

          for f in $(ls js/*.js | sort); do
            base=$(basename "$f" .js)
            name=${base#*-}
            key=$(to_camel "$name")
            {
              echo ""
              echo "/* === $base (toggle: window.goodFin.features.$key = false) === */"
              echo "if (window.goodFin.features.$key === true) {"
              cat "$f"
              echo "}"
            } >> build/_bundle.js
          done

          cp build/_bundle.js script.js
          esbuild build/_bundle.js --minify --outfile=script.min.js

      # ---------- Commit ----------
      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css style.min.css script.js script.min.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: compile SCSS and JS bundles"
            git push
          fi
