name: Build CSS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sass
        run: npm install -g sass

      - name: Concatenate sources
        run: |
          mkdir -p build
          : > build/_bundle.scss
          for f in $(ls src/*.scss | sort); do
            echo "/* === $(basename "$f") === */" >> build/_bundle.scss
            cat "$f" >> build/_bundle.scss
            echo "" >> build/_bundle.scss
          done

      - name: Compile expanded CSS
        run: sass --no-source-map --style=expanded build/_bundle.scss style.css

      - name: Compile minified CSS
        run: sass --no-source-map --style=compressed build/_bundle.scss style.min.css

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css style.min.css
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: compile SCSS to CSS"
            git push
          fi
