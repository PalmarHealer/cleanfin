name: Build

on:
  push:
    branches: [main]
    paths:
      - 'css/**'
      - 'js/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tools
        run: npm install -g sass esbuild postcss-cli postcss-import-url

      # ---------- CSS ----------
      - name: Concatenate SCSS sources
        run: |
          mkdir -p build
          : > build/_bundle.scss
          for f in $(ls css/*.scss | sort); do
            echo "/* === $(basename "$f") === */" >> build/_bundle.scss
            cat "$f" >> build/_bundle.scss
            echo "" >> build/_bundle.scss
          done

      - name: Compile expanded CSS
        run: sass --no-source-map --style=expanded build/_bundle.scss style.css

      - name: Compile minified CSS
        run: sass --no-source-map --style=compressed build/_bundle.scss style.min.css

      - name: Build all-in-one CSS (inline remote @imports)
        run: |
          npx postcss style.css --use postcss-import-url -o style.aio.css --no-map
          node scripts/aio-fonts.js style.aio.css
          esbuild style.aio.css --minify --outfile=style.aio.min.css

      # ---------- JS ----------
      - name: Bundle JS with feature toggles
        run: |
          mkdir -p build
          {
            echo "/* cleanFin script bundle — toggle individual modules via:"
            echo "   window.cleanFin = { features: { firefoxWarning: false } };"
            echo "   (set this BEFORE this script loads) */"
            echo "window.cleanFin = window.cleanFin || {};"
            echo "window.cleanFin.features = window.cleanFin.features || {};"
            echo ""
          } > build/_bundle.js

          to_camel() {
            echo "$1" | awk -F- '{out=$1; for(i=2;i<=NF;i++){out=out toupper(substr($i,1,1)) substr($i,2)}; print out}'
          }

          for f in $(ls js/*.js | sort); do
            base=$(basename "$f" .js)
            name=${base#*-}
            key=$(to_camel "$name")
            {
              echo ""
              echo "/* === $base (toggle: window.cleanFin.features.$key = false) === */"
              echo "if (window.cleanFin.features.$key === true) {"
              cat "$f"
              echo "}"
            } >> build/_bundle.js
          done

          cp build/_bundle.js script.js
          esbuild build/_bundle.js --minify --outfile=script.min.js

      # ---------- Commit ----------
      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css style.min.css style.aio.css style.aio.min.css script.js script.min.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: compile SCSS and JS bundles"
            git push
          fi
